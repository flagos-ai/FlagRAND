name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install build and schema-test tools
        run: python -m pip install build twine pytest PyYAML
      - name: Validate registry and source isolation
        run: |
          python tools/validate_operator_registry.py
          python -m compileall -q src benchmark tests tools
          python -m pytest -q \
            tests/accuracy/test_platform_isolation.py \
            tests/accuracy/test_summary_json.py
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: flagrand-dist-${{ github.sha }}
          path: dist/
