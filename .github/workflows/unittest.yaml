name: unit-test

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Hardware backend to test
        required: true
        default: all
        type: choice
        options: [all, nvidia, iluvatar, thead, ascend-cann900, hygon]
      profile:
        description: Performance profile
        required: true
        default: smoke
        type: choice
        options: [smoke, acceptance]
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  preprocess:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.matrix.outputs.labels }}
      backend_matrix: ${{ steps.matrix.outputs.backend_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/backends.json
          sparse-checkout-cone-mode: false
      - id: matrix
        uses: actions/github-script@v7
        env:
          REQUESTED_BACKEND: ${{ inputs.backend || '' }}
        with:
          script: |
            const fs = require('fs');
            const backends = JSON.parse(fs.readFileSync('.github/backends.json', 'utf8'));
            let labels = [];
            let selected = [];

            if (context.eventName === 'pull_request') {
              const {data} = await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });
              labels = data.map(label => label.name);
              if (labels.includes('tests') || labels.includes('core')) {
                selected = backends.filter(backend => backend.enabled);
              } else {
                selected = backends.filter(backend => backend.enabled && labels.includes(backend.label));
              }
            } else if (context.eventName === 'workflow_dispatch') {
              const requested = process.env.REQUESTED_BACKEND;
              selected = backends.filter(backend =>
                backend.enabled && (requested === 'all' || backend.backend === requested));
            }

            const include = selected.map(backend => ({
              backend: backend.backend,
              runner_label: backend.runner_label,
              gpu_check: backend.gpu_check,
            }));
            core.setOutput('labels', JSON.stringify(labels));
            core.setOutput('backend_matrix', JSON.stringify({include}));
            core.info(`Selected backends: ${include.map(item => item.backend).join(', ') || 'none'}`);

  backend-tests:
    needs: preprocess
    if: fromJSON(needs.preprocess.outputs.backend_matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preprocess.outputs.backend_matrix) }}
    uses: ./.github/workflows/backend-test.yaml
    with:
      backend: ${{ matrix.backend }}
      runner_label: ${{ matrix.runner_label }}
      gpu_check_script: ${{ matrix.gpu_check }}
      profile: ${{ inputs.profile || 'smoke' }}

  iluvatar-cpp-wrapper:
    if: github.event_name == 'workflow_dispatch' && inputs.backend == 'iluvatar'
    runs-on: iluvatar
    timeout-minutes: 90
    concurrency:
      group: flagrand-iluvatar-cpp-wrapper-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Build FlagRAND C++ wrapper
        shell: bash
        env:
          ENABLE_CPP: "1"
        run: ./setup.sh iluvatar

      - name: Check accelerator availability
        shell: bash
        run: |
          source scripts/ci/backend_env.sh iluvatar
          bash tools/gpu_check_iluvatar.sh

      - name: Run C++ wrapper acceptance
        shell: bash
        run: |
          source scripts/ci/backend_env.sh iluvatar
          .venv/bin/python cpp/tests/test_wrapper.py
