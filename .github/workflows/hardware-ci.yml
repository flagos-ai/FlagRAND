name: Hardware CI

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Hardware backend to validate
        required: true
        default: all
        type: choice
        options: [all, ppu, ascend_910c]
      profile:
        description: Performance matrix profile
        required: true
        default: smoke
        type: choice
        options: [smoke, acceptance]
      device:
        description: Logical Ascend device index
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: flagrand-hardware-${{ github.ref }}-${{ inputs.backend }}
  cancel-in-progress: false

jobs:
  ppu:
    if: inputs.backend == 'all' || inputs.backend == 'ppu'
    runs-on: [self-hosted, ppu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: PPU correctness and end-to-end performance
        env:
          FLAGRAND_PERF_PROFILE: ${{ inputs.profile }}
        run: bash scripts/ci/run_ppu_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-results
          path: ppu_results/
          if-no-files-found: warn

  ascend-910c:
    if: inputs.backend == 'all' || inputs.backend == 'ascend_910c'
    runs-on: [self-hosted, ascend-910c]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Ascend 910C correctness and end-to-end performance
        env:
          FLAGRAND_DEVICE: ${{ inputs.device }}
          FLAGRAND_PERF_PROFILE: ${{ inputs.profile }}
          FLAGRAND_SPEEDUP_MIN: "0.95"
        run: bash scripts/ci/run_ascend_910c_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ascend-910c-results
          path: ascend_910c_results/
          if-no-files-found: warn
