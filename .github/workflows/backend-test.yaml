name: Backend Test

on:
  workflow_call:
    inputs:
      backend:
        description: FlagRAND backend name
        required: true
        type: string
      runner_label:
        description: GitHub Actions runner label
        required: true
        type: string
      gpu_check_script:
        description: Vendor device discovery script
        required: true
        type: string
      profile:
        description: Performance profile
        required: false
        default: smoke
        type: string
      operator:
        description: Optional single API name
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack FlagRAND source
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/flagrand-source.tar.gz" .

      - name: Upload FlagRAND source
        uses: actions/upload-artifact@v4
        with:
          name: flagrand-source-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flagrand-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    needs: source
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180
    concurrency:
      group: flagrand-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download FlagRAND source
        uses: actions/download-artifact@v4
        with:
          name: flagrand-source-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flagrand-source-${{ inputs.backend }}

      - name: Restore FlagRAND source
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf "$RUNNER_TEMP/flagrand-source-${{ inputs.backend }}/flagrand-source.tar.gz" \
            -C "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/setup-flagrand
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Run FlagRAND correctness and performance
        shell: bash
        env:
          FLAGRAND_PERF_PROFILE: ${{ inputs.profile }}
          FLAGRAND_TEST_OP: ${{ inputs.operator }}
        run: bash scripts/ci/run_backend_ci.sh "${{ inputs.backend }}"

      - name: Upload FlagRAND results
        id: upload-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagrand-${{ inputs.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci_logs/
            nvidia_results/
            muxi_results/
            corex_results/
            ppu_logs/
            ppu_results/
            ascend_910c_logs/
            ascend_910c_results/
          if-no-files-found: warn
