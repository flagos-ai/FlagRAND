name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install quality tools
        run: python -m pip install pre-commit PyYAML
      - name: Validate operator registry
        run: python tools/validate_operator_registry.py
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run CPU-safe tests
        run: >-
          python -m pytest -q
          tests/accuracy/test_api.py
          tests/accuracy/test_backend.py
          tests/accuracy/test_ppu_compiler.py
          tests/accuracy/test_platform_isolation.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
