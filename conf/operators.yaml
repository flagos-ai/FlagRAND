ops:
  - id: raw32
    description: Counter-based Philox4x32-10 raw 32-bit output.
    for:
      - flagrand.ops.philox.raw32
    labels:
      - random
      - philox
    kind:
      - Distribution
    dtypes: [int32]
    accuracy_test: tests/accuracy/test_philox_cuda.py
    platform_accuracy_tests: [tests/accuracy/test_philox_cuda.py, tests/accuracy/test_philox_nvidia.py, tests/accuracy/test_philox_metax.py, tests/accuracy/test_philox_ascend_910c.py]
    performance_test: benchmark/test_random_perf.py
    stages:
      - stable: '0.1'
